services:
  backend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EVOLUTION_URL: ${EVOLUTION_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      REDIS_URL: ${REDIS_URL}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-"Tu es un agent de support client. Réponds en français, de façon concise et professionnelle."}
