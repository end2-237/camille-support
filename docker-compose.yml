services:
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_URL}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      DATABASE_PROVIDER: postgresql
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_URI: ${DATABASE_URL}
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: "7"
      DATABASE_DELETE_MESSAGE: "true"

      WEBHOOK_GLOBAL_URL: ${BACKEND_URL}/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      QRCODE_LIMIT: "30"
      QRCODE_EXPIRATION_TIME: "30"
      DEL_INSTANCE: "false"
      CORS_ORIGIN: "*"
    entrypoint: ["/bin/bash", "-c", "printf 'DATABASE_URL=%s\\nDATABASE_CONNECTION_URI=%s\\nDATABASE_PROVIDER=%s\\nSERVER_TYPE=http\\nSERVER_PORT=8080\\n' \"$DATABASE_URL\" \"$DATABASE_CONNECTION_URI\" \"$DATABASE_PROVIDER\" > /evolution/.env && npx prisma db push --schema ./prisma/postgresql-schema.prisma --skip-generate --accept-data-loss && npm run start:prod"]
    volumes:
      - evolution_data:/evolution/instances

volumes:
  evolution_data:
